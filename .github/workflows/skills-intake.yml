name: Skills intake

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'nudge.md'

permissions:
  contents: write

concurrency:
  group: skills-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the nudge and syncs index.md, then commits only if content
      # actually changed. A GITHUB_TOKEN push does not trigger workflows, so
      # this cannot loop.
      - name: Install nudge, sync index
        env:
          MERGE_AUTHOR: ${{ github.event.head_commit.author.username }}
        run: python3 .github/scripts/skills_intake.py
